<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Live Chat Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1 data-i18n="popupTitle">Display Settings</h1>
            <div class="status" id="displayStatus"></div>
        </div>
        <div class="settings">
            <label class="radio-option">
                <input type="radio" name="displayMode" value="both" checked>
                <span data-i18n="displayModeBoth">Both (Name (Handle))</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="displayMode" value="name">
                <span data-i18n="displayModeNameOnly">Name Only</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="displayMode" value="handle">
                <span data-i18n="displayModeHandleOnly">Handle Only</span>
            </label>
        </div>
        <div class="section-divider"></div>
        <h2 class="section-title" data-i18n="filterSectionTitle">Conversion Target</h2>
        <div class="settings">
            <label class="radio-option">
                <input type="radio" name="filterMode" value="all" checked>
                <span data-i18n="filterModeAll">Convert on all streams</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="filterMode" value="allow">
                <span data-i18n="filterModeAllow">Only streams in the allow list</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="filterMode" value="block">
                <span data-i18n="filterModeBlock">All streams except the block list</span>
            </label>
        </div>
        <div class="broadcaster">
            <div class="broadcaster-label" data-i18n="currentBroadcaster">Current broadcaster</div>
            <div class="broadcaster-name" id="broadcasterName"></div>
            <button id="toggleBroadcaster"></button>
        </div>
        <button id="openSettings" data-i18n="openSettings">Open Settings</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
